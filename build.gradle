plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

loom {
	accessWidenerPath = file("src/main/resources/modernwarpmenu.classtweaker")
}

fabricApi {
	configureDataGeneration(){
		client = true
	}

}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.

	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}
	exclusiveContent {
		forRepository {
			maven { url "https://maven.azureaaron.net/releases" }
		}

		filter {
			includeGroup "net.azureaaron"
		}
	}

	maven {
		name = "Xander Maven"
		url = "https://maven.isxander.dev/releases"
	}
	maven {
		name = "Terraformers"
		url = "https://maven.terraformersmc.com/"
	}
	maven {
		name = 'ParchmentMC'
		url = 'https://maven.parchmentmc.org'
	}
	maven { url "https://maven.shedaniel.me" }
    maven { url 'https://maven.operationpotato.com/releases' }

	//conditional-mixin https://github.com/Fallen-Breath/conditional-mixin
	maven { url 'https://maven.fallenbreath.me/releases' }

	maven { url 'https://repo.hypixel.net/repository/Hypixel/' }
	maven { url "https://pkgs.dev.azure.com/djtheredstoner/DevAuth/_packaging/public/maven/v1" }
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	//api "dev.architectury:architectury-fabric:${project.architectury_version}"
	implementation "dev.isxander:yet-another-config-lib:${project.yacl_version}"
	implementation "com.terraformersmc:modmenu:${project.modmenu_version}"
	compileOnly "me.shedaniel:RoughlyEnoughItems-api-fabric:${project.rei_version}"
	compileOnly "me.shedaniel:RoughlyEnoughItems-fabric:${project.rei_version}"
    compileOnly "com.operationpotato:skyblock-item-list-api:${project.itemlist_version}"
	compileOnly "maven.modrinth:skyblocker-liap:${project.skyblocker_version}"
	include(implementation("me.fallenbreath:conditional-mixin-fabric:${project.conditional_mixin_version}"))
	//include(implementation("net.hypixel:mod-api:${project.hypixel_mod_api_version}"))
	include(implementation("net.azureaaron:hm-api:${project.hm_api_version}"))
	//runtimeOnly "me.djtheredstoner:DevAuth-fabric:1.2.2"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}